<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Silence in NYC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
<style>
  :root {
    --ink: #ffffff;
    --muted: rgba(255, 255, 255, 0.72);
    --line: rgba(180, 200, 230, 0.14);
    --accent: #7ab0f0;
    --panel-ink: #12161c;
    --panel-muted: #5a6570;
    --white: #ffffff;
    --wash: rgba(18, 22, 32, 0.82);
    --font-display: "Space Grotesk", system-ui, sans-serif;
    --font-ui: "Sora", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    font-family: var(--font-ui);
    color: var(--ink);
    background: #0b0e14;
    -webkit-font-smoothing: antialiased;
  }
  #app { position: relative; width: 100%; height: 100%; overflow: hidden; }

  #map {
    position: absolute; inset: 0;
    background: #0b0e14;
  }
  .leaflet-tile-pane { filter: contrast(1.05) brightness(0.92); }
  .leaflet-control-attribution {
    background: rgba(12, 16, 24, .85) !important;
    color: #7a889c !important;
    font-family: var(--font-ui) !important;
    font-size: 9px !important;
    letter-spacing: 0.02em;
    border: none !important;
    box-shadow: none !important;
  }
  .leaflet-control-attribution a { color: #9aaccc !important; }
  .leaflet-control-zoom a {
    background: var(--wash) !important;
    color: var(--ink) !important;
    border: 1px solid var(--line) !important;
    width: 32px !important;
    height: 32px !important;
    line-height: 32px !important;
    border-radius: 0 !important;
    font-family: var(--font-ui) !important;
    backdrop-filter: blur(10px);
  }
  .leaflet-bar { border: none !important; box-shadow: none !important; }

  #watercolor {
    position: absolute; inset: 0;
    pointer-events: none;
    z-index: 450;
    mix-blend-mode: screen;
    /* wet glow on the dark basemap */
    filter: blur(2.2px) saturate(1.5) brightness(1.12);
    will-change: transform;
    transform-origin: 0 0;
  }

  #brand {
    position: absolute; top: 28px; left: 76px; z-index: 800;
    pointer-events: none;
    max-width: min(460px, calc(100vw - 96px));
  }
  #brand h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(34px, 4.8vw, 52px);
    letter-spacing: -0.045em;
    line-height: 0.98;
    color: #ffffff;
    text-shadow: 0 1px 18px rgba(0, 0, 0, 0.55);
  }
  #brand p {
    margin: 12px 0 0;
    font-family: var(--font-ui);
    font-style: normal;
    font-weight: 400;
    font-size: clamp(13px, 1.4vw, 15px);
    letter-spacing: -0.01em;
    line-height: 1.45;
    color: rgba(255, 255, 255, 0.78);
    max-width: 32ch;
    text-shadow: 0 1px 12px rgba(0, 0, 0, 0.5);
  }

  #panel {
    position: absolute; top: 24px; right: 24px; z-index: 800;
    width: min(288px, calc(100vw - 48px));
    background: var(--wash);
    border: 1px solid var(--line);
    border-radius: 0;
    padding: 20px;
    backdrop-filter: blur(14px);
    color: var(--ink);
  }
  #panel h2 {
    margin: 0 0 6px;
    font-family: var(--font-ui);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  #panel .hint {
    margin: 0 0 18px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.45;
    font-weight: 400;
  }
  .step { margin-bottom: 16px; }
  .step-label {
    display: block;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .step-note {
    margin: 8px 0 0;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.4;
  }
  .step-note.ready { color: var(--ink); font-weight: 500; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.06);
    color: #ffffff;
    border-radius: 0;
    padding: 10px 14px;
    font-family: var(--font-ui);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: background .2s ease, border-color .2s ease, color .2s ease;
  }
  .btn:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(122, 176, 240, 0.5); }
  .btn:active { background: rgba(255, 255, 255, 0.16); }
  .btn.primary {
    background: #ffffff;
    color: #0b0e14;
    border-color: #ffffff;
    width: 100%;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-size: 11px;
    font-weight: 600;
  }
  .btn.primary:hover { background: #dce6f4; border-color: #dce6f4; color: #0b0e14; }
  .btn.primary:disabled {
    opacity: .28; cursor: not-allowed;
  }
  .btn.ghost {
    background: transparent;
    border-color: transparent;
    color: var(--muted);
    padding-left: 0;
    padding-right: 12px;
    font-size: 11px;
    letter-spacing: 0.04em;
  }
  .btn.ghost:hover { color: var(--accent); background: transparent; }
  .btn.block { width: 100%; }
  #fileInput { display: none; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .actions.tight { margin-top: 14px; margin-bottom: 0; }
  .status {
    min-height: 32px;
    font-size: 12px;
    line-height: 1.5;
    color: var(--muted);
    padding: 14px 0 0;
    border-top: 1px solid var(--line);
    margin-top: 16px;
  }
  .status strong { color: var(--ink); font-weight: 600; }
  .swatch {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    vertical-align: 0; margin-right: 5px;
  }

  #legend {
    position: absolute; left: 24px; bottom: 24px; z-index: 800;
    width: min(260px, calc(100vw - 48px));
    background: var(--wash);
    border: 1px solid var(--line);
    border-radius: 0;
    padding: 14px 16px;
    backdrop-filter: blur(12px);
  }
  #legend .scale-title {
    font-family: var(--font-ui);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }
  #legend .scale-bar {
    height: 6px;
    border-radius: 0;
    background: linear-gradient(
      90deg,
      #7ad4ff 0%,
      #3aa0ff 20%,
      #4a6aff 40%,
      #7a3dff 60%,
      #9b20e8 80%,
      #5a00a8 100%
    );
  }
  #legend .scale-labels {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 11px;
    font-weight: 400;
    color: var(--muted);
  }
  #legend .scale-labels span:last-child { color: #d080ff; font-weight: 600; }

  #legend .filters {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
  }
  .check {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    user-select: none;
    font-family: var(--font-ui);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: var(--muted);
    transition: color .15s ease;
  }
  .check:hover { color: var(--ink); }
  .check input {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
    pointer-events: none;
  }
  .check .box {
    position: relative;
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    border: 1.5px solid rgba(255, 255, 255, 0.28);
    background: rgba(255, 255, 255, 0.04);
    transition: background .15s ease, border-color .15s ease, box-shadow .15s ease;
  }
  .check .box::after {
    content: "";
    position: absolute;
    left: 4px;
    top: 1px;
    width: 5px;
    height: 9px;
    border: solid #0b0e14;
    border-width: 0 1.5px 1.5px 0;
    transform: scale(0) rotate(45deg);
    transition: transform .12s ease;
  }
  .check input:checked + .box {
    background: var(--swatch, var(--accent));
    border-color: var(--swatch, var(--accent));
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--swatch, var(--accent)) 22%, transparent);
  }
  .check input:checked + .box::after {
    transform: scale(1) rotate(45deg);
  }
  .check input:focus-visible + .box {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .check input:checked ~ .check-text { color: var(--ink); }
  .check[data-band="quiet"] { --swatch: #7ad4ff; }
  .check[data-band="street"] { --swatch: #5a6aff; }
  .check[data-band="alert"] { --swatch: #9b20e8; }

  #spotCount {
    position: absolute; right: 24px; bottom: 24px; z-index: 800;
    background: var(--wash);
    border: 1px solid var(--line);
    border-radius: 0;
    padding: 9px 14px;
    font-family: var(--font-ui);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    backdrop-filter: blur(12px);
  }
  #spotCount #countVal { color: var(--ink); font-weight: 600; }

  .pin-pulse {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--accent);
    border: 2px solid #fff;
    box-shadow: 0 0 0 4px rgba(106, 138, 212, 0.2);
  }

  @media (max-width: 720px) {
    #brand { top: 14px; left: 52px; }
    #brand h1 { font-size: clamp(28px, 8vw, 40px); }
    #brand p { font-size: 14px; margin-top: 10px; }
    #panel {
      top: auto; bottom: 0; right: 0; left: 0;
      width: 100%;
      max-height: 46vh; overflow: auto;
      border-left: none; border-right: none; border-bottom: none;
      backdrop-filter: blur(16px);
    }
    #legend { left: 14px; bottom: auto; top: 92px; width: min(180px, calc(100vw - 100px)); }
    #spotCount { bottom: auto; top: 14px; right: 14px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <canvas id="watercolor"></canvas>

  <div id="brand">
    <h1>Silence in NYC</h1>
    <p>New York I love you but I need some silence right now</p>
  </div>

  <aside id="panel">
    <h2>Add a sound</h2>
    <p class="hint">Place yourself, add a voice note, paint.</p>

    <div class="step">
      <span class="step-label">1 · Place</span>
      <button class="btn block" id="btnLocate" type="button">Share my position</button>
      <p class="step-note" id="placeNote">Or tap anywhere on the map.</p>
    </div>

    <div class="step">
      <span class="step-label">2 · Sound</span>
      <div class="actions">
        <button class="btn" id="btnUpload" type="button">Upload</button>
        <button class="btn" id="btnRecord" type="button">Record 5s</button>
        <input type="file" id="fileInput" accept="audio/*,.m4a,.mp3,.wav,.ogg,.webm">
      </div>
      <p class="step-note" id="soundNote">No sound yet.</p>
    </div>

    <button class="btn primary" id="btnPaint" type="button" disabled>Paint</button>

    <div class="actions tight">
      <button class="btn ghost" id="btnClear" type="button">Reset pin</button>
      <button class="btn ghost" id="btnSave" type="button">Download PNG</button>
    </div>

    <div class="status" id="status">Tap the map or share your position to begin.</div>
  </aside>

  <div id="legend">
    <div class="scale-title">Sound intensity</div>
    <div class="scale-bar" aria-hidden="true"></div>
    <div class="scale-labels">
      <span>Quiet</span>
      <span>Street</span>
      <span>Alert</span>
    </div>
    <div class="filters" role="group" aria-label="Noise layers">
      <label class="check" data-band="quiet">
        <input type="checkbox" id="filterQuiet" name="noise-filter" value="quiet">
        <span class="box" aria-hidden="true"></span>
        <span class="check-text">Quiet noise</span>
      </label>
      <label class="check" data-band="street">
        <input type="checkbox" id="filterStreet" name="noise-filter" value="street">
        <span class="box" aria-hidden="true"></span>
        <span class="check-text">Street noise</span>
      </label>
      <label class="check" data-band="alert">
        <input type="checkbox" id="filterAlert" name="noise-filter" value="alert" checked>
        <span class="box" aria-hidden="true"></span>
        <span class="check-text">Alert noise</span>
      </label>
    </div>
  </div>

  <div id="spotCount"><span id="countVal">0</span> sounds</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  const MANHATTAN = {
    center: [40.758, -73.9855],
    // Island only — Battery → Inwood, Hudson → East River
    bounds: L.latLngBounds([40.698, -74.022], [40.878, -73.906]),
  };
  const RADIUS_M = 2.8; // personal field recordings
  const RADIUS_311_M = 2.0; // denser 311 washes
  const MIN_RADIUS_PX = 5;
  /** Intensity bands matching the legend */
  const NOISE_BANDS = {
    quiet: [0, 0.35],
    street: [0.35, 0.65],
    alert: [0.65, 1.01],
  };
  /** Alert on by default; quiet & street off */
  const noiseFilter = { quiet: false, street: false, alert: true };
  /** Below this on-screen size, draw lite watercolor instead of full Hobbs */
  const SIMPLE_SPOT_PX = 18;
  /** Cap how many 311 complaints we paint at low zoom (stable subset) */
  const LOD_311 = [
    { z: 13, max: 1500 },
    { z: 14, max: 3500 },
    { z: 15, max: Infinity },
  ];
  const STORAGE_KEY = "fresque-sonore-spots-v4";

  // Tyler Hobbs watercolor: stacked low-opacity deformed polygons
  // https://www.tylerxhobbs.com/words/a-guide-to-simulating-watercolor-paint-with-generative-art
  const WC_SIDES = 7;
  const WC_BASE_DEPTH = 4;
  const WC_LAYER_DEPTH = 2;
  const WC_LAYERS = 32;
  const WC_LAYER_ALPHA = 0.11;
  // Lightweight watercolor for city-zoom dots (organic edges, still cheap)
  const WC_LITE_SIDES = 6;
  const WC_LITE_BASE_DEPTH = 3;
  const WC_LITE_LAYER_DEPTH = 1;
  const WC_LITE_LAYERS = 16;
  const WC_LITE_ALPHA = 0.12;

  // 311 color families: street = red, vehicle = magenta, helicopter = dark purple
  const INTENSITY_311_TYPE = {
    "Noise - Street/Sidewalk": 0.36,
    "Noise - Vehicle": 0.58,
    "Noise - Helicopter": 0.93,
  };
  // Descriptor nudges within the type’s band (not across families)
  const INTENSITY_311_DESCRIPTOR = {
    "Loud Talking": -0.08,
    "Engine Idling": -0.06,
    "Car/Truck Music": 0.04,
    "Loud Music/Party": 0.1,
    "Car/Truck Horn": 0.12,
    Other: 0.0,
    "News Gathering": 0.02,
    NYPD: 0.04,
  };
  const INTENSITY_311_BAND = {
    "Noise - Street/Sidewalk": [0.22, 0.52], // bright red → magenta
    "Noise - Vehicle": [0.48, 0.72], // magenta → purple
    "Noise - Helicopter": [0.86, 1.0], // dark purple
  };

  // Loudness / harshness bands (plus legacy class labels from older paints)
  const STRESS_BY_LABEL = {
    silence: 0.05,
    quiet: 0.18,
    soft: 0.32,
    lively: 0.48,
    noisy: 0.68,
    harsh: 0.88,
    no_sound: 0.05,
    air_conditioner: 0.08,
    children_playing: 0.18,
    street_music: 0.22,
    dog_bark: 0.26,
    engine_idling: 0.28,
    car_horn: 0.45,
    drilling: 0.52,
    jackhammer: 0.55,
    gun_shot: 0.6,
    siren: 0.65,
  };

  // Quiet → street → alert — electric blue → indigo → deep violet
  const INTENSITY_STOPS = [
    { t: 0.0, c: [122, 212, 255] },
    { t: 0.2, c: [58, 160, 255] },
    { t: 0.4, c: [74, 106, 255] },
    { t: 0.6, c: [122, 61, 255] },
    { t: 0.8, c: [155, 32, 232] },
    { t: 1.0, c: [90, 0, 168] },
  ];

  const map = L.map("map", {
    center: MANHATTAN.center,
    zoom: 13,
    minZoom: 13, // only limit: cannot zoom out further than this
    maxZoom: 20,
    zoomControl: true,
  });
  let basemapLayer = null;
  function setBasemap(cartoKey) {
    if (basemapLayer) map.removeLayer(basemapLayer);
    const keyQ = cartoKey ? `?key=${encodeURIComponent(cartoKey)}` : "";
    basemapLayer = L.tileLayer(
      `https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png${keyQ}`,
      {
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>',
        subdomains: "abcd",
        maxZoom: 20,
      }
    ).addTo(map);
  }
  // Wait for /api/config before adding tiles — CARTO watermark appears without a key

  const canvas = document.getElementById("watercolor");
  const ctx = canvas.getContext("2d", { alpha: true });
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  /** @type {{lat:number,lng:number,color:string,label:string,score:number,intensity?:number,stress?:number,rms?:number,id:string}[]} */
  let spots = [];
  let audioFile = null;
  let place = null; // { lat, lng }
  let pin = null;

  const el = {
    status: document.getElementById("status"),
    paint: document.getElementById("btnPaint"),
    count: document.getElementById("countVal"),
    placeNote: document.getElementById("placeNote"),
    soundNote: document.getElementById("soundNote"),
  };

  const STORAGE_311_KEY = "fresque-sonore-311-v1";

  // 311 complaints → always on, same watercolor as field recordings
  /** @type {{id:string,lat:number,lng:number,label:string,intensity:number,score:number,source:string,descriptor?:string,date?:string}[]} */
  let complaints311 = [];
  let loading311 = false;
  let paintRaf = 0;

  function intensityFrom311(type, descriptor) {
    const base = INTENSITY_311_TYPE[type] ?? 0.55;
    const band = INTENSITY_311_BAND[type] || [0.2, 0.9];
    const desc = String(descriptor || "").trim();
    let t = base;
    if (desc && Object.prototype.hasOwnProperty.call(INTENSITY_311_DESCRIPTOR, desc)) {
      t += INTENSITY_311_DESCRIPTOR[desc];
    } else if (desc) {
      const lower = desc.toLowerCase();
      if (/horn|siren|alarm/.test(lower)) t += 0.1;
      else if (/music|party|bass/.test(lower)) t += 0.06;
      else if (/talk|idle|idling/.test(lower)) t -= 0.06;
    }
    return Math.max(band[0], Math.min(band[1], t));
  }

  function complaintToSpot(p) {
    const label = p.type || "Noise - Street/Sidewalk";
    return {
      id: `311-${p.id}`,
      lat: p.lat,
      lng: p.lng,
      label,
      intensity: intensityFrom311(label, p.descriptor),
      score: 1,
      source: "311",
      descriptor: p.descriptor || "",
      date: p.date || "",
    };
  }

  function apply311Points(rawPoints) {
    complaints311 = (rawPoints || []).map(complaintToSpot);
    try {
      localStorage.setItem(
        STORAGE_311_KEY,
        JSON.stringify({ savedAt: Date.now(), points: rawPoints || [] })
      );
    } catch (_) {}
    schedulePaint();
  }

  function hydrate311FromLocal() {
    try {
      const raw = localStorage.getItem(STORAGE_311_KEY);
      if (!raw) return false;
      const data = JSON.parse(raw);
      if (!Array.isArray(data.points) || !data.points.length) return false;
      complaints311 = data.points.map(complaintToSpot);
      return true;
    } catch (_) {
      return false;
    }
  }

  function schedulePaint() {
    if (paintRaf) return;
    paintRaf = requestAnimationFrame(() => {
      paintRaf = 0;
      paintWatercolor();
    });
  }

  async function load311() {
    if (loading311) return;
    loading311 = true;
    try {
      let data = null;
      try {
        const res = await fetch(apiUrl("/api/311/noise?days=90&kind=all&limit=6000"));
        data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || "Could not load 311");
      } catch (_) {
        // Static snapshot shipped with the site (works even if the function is cold/down)
        const res = await fetch("/data/311_noise_cache.json", { cache: "force-cache" });
        data = await res.json().catch(() => ({}));
        if (!res.ok || !Array.isArray(data.points)) throw new Error("Could not load 311");
      }
      if (Array.isArray(data.points) && data.points.length) {
        apply311Points(data.points);
      } else if (data.warming && !complaints311.length) {
        // Server still warming — retry shortly; local cache may already be painting
        setTimeout(() => {
          loading311 = false;
          load311();
        }, 2500);
        return;
      }
    } catch (_) {
      // Keep whatever we already hydrated from localStorage
    } finally {
      loading311 = false;
    }
  }

  // Resolve API host: same origin (Netlify / FastAPI), else local Python server
  let API_BASE = "";
  function apiUrl(path) {
    return `${API_BASE}${path}`;
  }
  async function resolveApiBase() {
    const candidates = [];
    if (location.protocol.startsWith("http")) candidates.push("");
    if (location.hostname === "localhost" || location.hostname === "127.0.0.1") {
      candidates.push("http://127.0.0.1:8765");
    }
    for (const base of candidates) {
      try {
        const res = await fetch(`${base}/api/health`, { cache: "no-store" });
        if (res.ok) {
          API_BASE = base;
          return true;
        }
      } catch (_) {}
    }
    return false;
  }

  // Client-side loudness + harshness (same model as the Python server)
  const SILENCE_RMS = 0.006;
  const TARGET_SR = 16000;
  const MID_FREQ_HZ = 800;
  const HIGH_FREQ_HZ = 2200;
  const LABEL_BY_INTENSITY = [
    [0.12, "silence"],
    [0.28, "quiet"],
    [0.45, "soft"],
    [0.62, "lively"],
    [0.80, "noisy"],
    [1.01, "harsh"],
  ];

  function resampleLinear(input, fromSr, toSr) {
    if (fromSr === toSr) return input;
    const ratio = fromSr / toSr;
    const outLen = Math.max(1, Math.floor(input.length / ratio));
    const out = new Float32Array(outLen);
    for (let i = 0; i < outLen; i++) {
      const src = i * ratio;
      const i0 = Math.floor(src);
      const i1 = Math.min(i0 + 1, input.length - 1);
      const t = src - i0;
      out[i] = input[i0] * (1 - t) + input[i1] * t;
    }
    return out;
  }

  function peakWindowRms(audio, sr, winS = 0.25) {
    const win = Math.max(32, Math.floor(sr * winS));
    if (audio.length <= win) {
      let s = 0;
      for (let i = 0; i < audio.length; i++) s += audio[i] * audio[i];
      return audio.length ? Math.sqrt(s / audio.length) : 0;
    }
    const hop = Math.floor(win / 2);
    let best = 0;
    for (let i = 0; i <= audio.length - win; i += hop) {
      let s = 0;
      for (let j = 0; j < win; j++) s += audio[i + j] * audio[i + j];
      best = Math.max(best, Math.sqrt(s / win));
    }
    return best;
  }

  function spectralProfile(audio, sr) {
    // Analyze a short window only — full-clip DFT is too slow in the browser
    const maxN = 4096;
    let start = 0;
    if (audio.length > maxN) {
      // Prefer the loudest short region
      const win = maxN;
      const hop = Math.floor(win / 2);
      let best = -1;
      let bestAt = 0;
      for (let i = 0; i <= audio.length - win; i += hop) {
        let s = 0;
        for (let j = 0; j < win; j++) s += audio[i + j] * audio[i + j];
        if (s > best) {
          best = s;
          bestAt = i;
        }
      }
      start = bestAt;
    }
    const n = Math.min(maxN, audio.length);
    if (n < 32) return { centroid: 0, mid: 0, high: 0 };

    const re = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      const w = 0.5 * (1 - Math.cos((2 * Math.PI * i) / (n - 1 || 1)));
      re[i] = audio[start + i] * w;
    }
    const half = Math.floor(n / 2) + 1;
    const power = new Float64Array(half);
    for (let k = 0; k < half; k++) {
      let rr = 0;
      let ii = 0;
      const ang = (-2 * Math.PI * k) / n;
      for (let t = 0; t < n; t++) {
        rr += re[t] * Math.cos(ang * t);
        ii += re[t] * Math.sin(ang * t);
      }
      power[k] = rr * rr + ii * ii;
    }
    let total = 1e-12;
    let weighted = 0;
    let mid = 0;
    let high = 0;
    for (let k = 0; k < half; k++) {
      const freq = (k * sr) / n;
      const p = power[k];
      total += p;
      weighted += freq * p;
      if (freq >= MID_FREQ_HZ && freq < HIGH_FREQ_HZ) mid += p;
      if (freq >= HIGH_FREQ_HZ) high += p;
    }
    return {
      centroid: weighted / total,
      mid: mid / total,
      high: high / total,
    };
  }

  function loudness01(rms, peakRms) {
    const level = 0.65 * rms + 0.35 * (peakRms || rms);
    if (level <= SILENCE_RMS) return 0;
    const lo = Math.log10(0.025);
    const hi = Math.log10(0.32);
    return Math.min(1, Math.max(0, (Math.log10(Math.max(level, 1e-6)) - lo) / (hi - lo)));
  }

  function harshness01(centroidHz, mid, high) {
    const bright = Math.min(1, Math.max(0, (centroidHz - 300) / 1800));
    return Math.min(1, Math.max(0, 0.25 * bright + 0.55 * mid + 0.5 * high));
  }

  function intensityToHex(t) {
    const [r, g, b] = intensityToRgb(t);
    return `#${r.toString(16).padStart(2, "0")}${g.toString(16).padStart(2, "0")}${b.toString(16).padStart(2, "0")}`.toUpperCase();
  }

  function analyzeClip(audio, sr) {
    let sum = 0;
    for (let i = 0; i < audio.length; i++) sum += audio[i] * audio[i];
    const rms = audio.length ? Math.sqrt(sum / audio.length) : 0;
    let intensity;
    let harshness = 0;
    let loud = 0;
    if (rms < SILENCE_RMS) {
      intensity = 0.04;
    } else {
      const peak = peakWindowRms(audio, sr);
      loud = loudness01(rms, peak);
      const { centroid, mid, high } = spectralProfile(audio, sr);
      harshness = harshness01(centroid, mid, high);
      intensity = Math.min(1, Math.max(0, 0.48 * loud + 0.52 * harshness));
    }
    const label = LABEL_BY_INTENSITY.find(([thresh]) => intensity < thresh)[1];
    return {
      label,
      score: 1,
      color: intensityToHex(intensity),
      rms,
      stress: intensity,
      intensity,
      harshness,
      loudness: loud,
    };
  }

  async function analyzeAudioFile(file) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) throw new Error("Web Audio not supported in this browser");
    const ctx = new Ctx();
    try {
      const raw = await file.arrayBuffer();
      const decoded = await ctx.decodeAudioData(raw.slice(0));
      const len = decoded.length;
      const ch = decoded.numberOfChannels;
      const mono = new Float32Array(len);
      for (let c = 0; c < ch; c++) {
        const data = decoded.getChannelData(c);
        for (let i = 0; i < len; i++) mono[i] += data[i] / ch;
      }
      // Cap analysis window (~8s) so DFT stays responsive
      const maxSamples = Math.floor(decoded.sampleRate * 8);
      const slice = mono.length > maxSamples ? mono.subarray(0, maxSamples) : mono;
      const audio = resampleLinear(slice, decoded.sampleRate, TARGET_SR);
      if (audio.length < 1600) throw new Error("Audio too short");
      return analyzeClip(audio, TARGET_SR);
    } finally {
      await ctx.close().catch(() => {});
    }
  }

  function cacheSpotsLocally() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(spots));
    el.count.textContent = String(spots.length);
  }

  async function persistSpot(spot) {
    cacheSpotsLocally();
    const res = await fetch(apiUrl("/api/spots"), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(spot),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || res.statusText || "Save failed");
    }
    return res.json();
  }

  async function loadSpotsFromServer() {
    const res = await fetch(apiUrl("/api/spots"));
    if (!res.ok) throw new Error("Could not load sounds");
    const data = await res.json();
    return data.spots || [];
  }

  // Drop old seed keys
  localStorage.removeItem("fresque-sonore-seed-version");
  localStorage.removeItem("fresque-sonore-spots-v3");
  localStorage.removeItem("fresque-sonore-spots-v2");
  localStorage.removeItem("fresque-sonore-spots-v1");

  function setStatus(html) {
    el.status.innerHTML = html;
  }

  function syncPaintEnabled() {
    el.paint.disabled = !(audioFile && place);
  }

  function placePin(lat, lng, source) {
    // Snap into Manhattan if GPS / tap lands outside
    const ll = L.latLng(lat, lng);
    if (!MANHATTAN.bounds.contains(ll)) {
      lat = Math.min(Math.max(lat, MANHATTAN.bounds.getSouth()), MANHATTAN.bounds.getNorth());
      lng = Math.min(Math.max(lng, MANHATTAN.bounds.getWest()), MANHATTAN.bounds.getEast());
    }
    place = { lat, lng };
    if (pin) map.removeLayer(pin);
    pin = L.marker([lat, lng], {
      icon: L.divIcon({ className: "", html: '<div class="pin-pulse"></div>', iconSize: [14, 14], iconAnchor: [7, 7] }),
    }).addTo(map);
    el.placeNote.textContent = source === "gps" ? "Using your position." : "Placed on the map.";
    el.placeNote.classList.add("ready");
    syncPaintEnabled();
  }

  function setSound(file, label) {
    audioFile = file;
    el.soundNote.textContent = label;
    el.soundNote.classList.add("ready");
    syncPaintEnabled();
  }

  function metersToPixels(meters, lat) {
    const zoom = map.getZoom();
    const mpp = (156543.03392 * Math.cos((lat * Math.PI) / 180)) / Math.pow(2, zoom);
    return meters / mpp;
  }

  function spotIntensity(s) {
    // Prefer server analysis intensity (loudness + high-frequency harshness)
    if (typeof s.intensity === "number" && Number.isFinite(s.intensity)) {
      return Math.max(0, Math.min(1, s.intensity));
    }
    const stress = STRESS_BY_LABEL[s.label] ?? (typeof s.stress === "number" ? s.stress : 0.25);
    const score = typeof s.score === "number" ? s.score : 0.7;
    const rms = typeof s.rms === "number" ? s.rms : 0.12;
    const loud = Math.max(0.5, Math.min(1.05, 0.55 + (rms / 0.35) * 0.35));
    return stress * score * loud;
  }

  function intensityToRgb(t) {
    t = Math.max(0, Math.min(1, t));
    for (let i = 0; i < INTENSITY_STOPS.length - 1; i++) {
      const a = INTENSITY_STOPS[i];
      const b = INTENSITY_STOPS[i + 1];
      if (t >= a.t && t <= b.t) {
        const u = (t - a.t) / (b.t - a.t || 1);
        return [
          Math.round(a.c[0] + (b.c[0] - a.c[0]) * u),
          Math.round(a.c[1] + (b.c[1] - a.c[1]) * u),
          Math.round(a.c[2] + (b.c[2] - a.c[2]) * u),
        ];
      }
    }
    return INTENSITY_STOPS[INTENSITY_STOPS.length - 1].c;
  }

  function resizeCanvas() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    paintWatercolor();
  }

  function spotSeed(s) {
    const key = s.id || `${s.lat},${s.lng},${s.label}`;
    let h = 2166136261;
    for (let i = 0; i < key.length; i++) {
      h ^= key.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  function mulberry32(a) {
    return function () {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function gauss(rnd) {
    let u = 0;
    let v = 0;
    while (u === 0) u = rnd();
    while (v === 0) v = rnd();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }

  /** Regular polygon with per-edge variance (sharp vs soft borders). */
  function makeRegularPoly(sides, radius, rnd) {
    const pts = [];
    const rot = rnd() * Math.PI * 2;
    for (let i = 0; i < sides; i++) {
      const a = rot + (i / sides) * Math.PI * 2;
      pts.push({
        x: Math.cos(a) * radius,
        y: Math.sin(a) * radius,
        v: 0.2 + rnd() * 0.9,
      });
    }
    return pts;
  }

  /** One subdivision pass: midpoint → Gaussian offset (Hobbs). */
  function deformOnce(poly, rnd, scale) {
    const out = [];
    const n = poly.length;
    for (let i = 0; i < n; i++) {
      const A = poly[i];
      const C = poly[(i + 1) % n];
      out.push(A);
      const mx = (A.x + C.x) * 0.5;
      const my = (A.y + C.y) * 0.5;
      const std = ((A.v + C.v) * 0.5) * scale;
      const childV = ((A.v + C.v) * 0.5) * (0.65 + rnd() * 0.4);
      out.push({
        x: mx + gauss(rnd) * std,
        y: my + gauss(rnd) * std,
        v: childV,
      });
    }
    return out;
  }

  function deform(poly, rnd, depth, baseScale) {
    let p = poly;
    for (let d = 0; d < depth; d++) {
      p = deformOnce(p, rnd, baseScale / Math.pow(1.35, d));
    }
    return p;
  }

  // Unit-space layer polygons cached per seed (static; redrawn at any zoom)
  /** @type {Map<number, {poly:{x:number,y:number}[], wash:boolean}[]>} */
  const layerCache = new Map();
  /** @type {Map<number, {poly:{x:number,y:number}[], wash:boolean}[]>} */
  const liteLayerCache = new Map();
  /** Pre-rendered spot sprites keyed by look + size — reused across frames */
  /** @type {Map<string, {canvas:HTMLCanvasElement, pad:number, size:number}>} */
  const spotSpriteCache = new Map();
  const SPOT_SPRITE_CACHE_MAX = 900;

  function getWatercolorLayers(seed) {
    if (layerCache.has(seed)) return layerCache.get(seed);

    const rndBase = mulberry32(seed);
    let base = makeRegularPoly(WC_SIDES, 1, rndBase);
    base = deform(base, rndBase, WC_BASE_DEPTH, 0.42);

    const rndLayer = mulberry32(seed ^ 0x85ebca6b);
    const layers = [];
    for (let i = 0; i < WC_LAYERS; i++) {
      // Interleave pigment with pale wash (red → white), per Hobbs color blending tip
      const wash = i % 5 === 4;
      const poly = deform(
        base.map((p) => ({ x: p.x, y: p.y, v: p.v })),
        rndLayer,
        WC_LAYER_DEPTH,
        0.2
      ).map((p) => ({ x: p.x, y: p.y }));
      layers.push({ poly, wash });
    }
    layerCache.set(seed, layers);
    return layers;
  }

  function getLiteWatercolorLayers(seed) {
    if (liteLayerCache.has(seed)) return liteLayerCache.get(seed);

    const rndBase = mulberry32(seed ^ 0x27d4eb2d);
    let base = makeRegularPoly(WC_LITE_SIDES, 1, rndBase);
    base = deform(base, rndBase, WC_LITE_BASE_DEPTH, 0.62);

    const rndLayer = mulberry32(seed ^ 0x165667b1);
    const layers = [];
    for (let i = 0; i < WC_LITE_LAYERS; i++) {
      const wash = i % 3 === 2;
      const poly = deform(
        base.map((p) => ({ x: p.x, y: p.y, v: p.v })),
        rndLayer,
        WC_LITE_LAYER_DEPTH,
        0.38
      ).map((p) => ({ x: p.x, y: p.y }));
      layers.push({ poly, wash });
    }
    liteLayerCache.set(seed, layers);
    return layers;
  }

  function fillPoly(target, poly, cx, cy, scale) {
    target.beginPath();
    for (let i = 0; i < poly.length; i++) {
      const px = cx + poly[i].x * scale;
      const py = cy + poly[i].y * scale;
      if (i === 0) target.moveTo(px, py);
      else target.lineTo(px, py);
    }
    target.closePath();
    target.fill();
  }

  function drawHobbsSpot(target, cx, cy, rPx, rgb, seed, intensity) {
    const layers = getWatercolorLayers(seed);
    const pigment = rgb;
    const washRgb = [
      Math.round(pigment[0] + (255 - pigment[0]) * 0.55),
      Math.round(pigment[1] + (255 - pigment[1]) * 0.55),
      Math.round(pigment[2] + (255 - pigment[2]) * 0.55),
    ];
    const alphaScale = 0.85 + intensity * 0.55;

    // Wet under-bloom
    const halo = target.createRadialGradient(cx, cy, rPx * 0.1, cx, cy, rPx * 2.1);
    halo.addColorStop(0, `rgba(${pigment[0]},${pigment[1]},${pigment[2]},${0.16 * alphaScale})`);
    halo.addColorStop(0.4, `rgba(${washRgb[0]},${washRgb[1]},${washRgb[2]},${0.1 * alphaScale})`);
    halo.addColorStop(1, "rgba(255,255,255,0)");
    target.fillStyle = halo;
    target.beginPath();
    target.arc(cx, cy, rPx * 2.1, 0, Math.PI * 2);
    target.fill();

    for (const layer of layers) {
      const [r, g, b] = layer.wash ? washRgb : pigment;
      const a = WC_LAYER_ALPHA * alphaScale * (layer.wash ? 0.55 : 1);
      target.fillStyle = `rgba(${r},${g},${b},${a})`;
      fillPoly(target, layer.poly, cx, cy, rPx * (0.92 + (layer.wash ? 0.12 : 0)));
    }

    // Light texture masking: punched micro-circles (Hobbs), seed-stable
    const rndTex = mulberry32(seed ^ 0xc2b2ae35);
    target.save();
    target.globalCompositeOperation = "destination-out";
    const holes = 22 + Math.floor(rndTex() * 26);
    for (let i = 0; i < holes; i++) {
      const ang = rndTex() * Math.PI * 2;
      const d = Math.sqrt(rndTex()) * rPx * 1.05;
      const len = (0.05 + Math.abs(gauss(rndTex)) * 0.08) * rPx;
      target.beginPath();
      target.arc(cx + Math.cos(ang) * d, cy + Math.sin(ang) * d, Math.max(0.4, len), 0, Math.PI * 2);
      target.fillStyle = `rgba(0,0,0,${0.1 + rndTex() * 0.22})`;
      target.fill();
    }
    target.restore();
  }

  /** Lite watercolor for small spots — irregular edges + wet bloom, still cheap */
  function drawSimpleSpot(target, cx, cy, rPx, rgb, seed, intensity) {
    const layers = getLiteWatercolorLayers(seed);
    const rnd = mulberry32(seed ^ 0x9e3779b9);
    const pigment = rgb;
    const washRgb = [
      Math.round(pigment[0] + (255 - pigment[0]) * 0.35),
      Math.round(pigment[1] + (255 - pigment[1]) * 0.35),
      Math.round(pigment[2] + (255 - pigment[2]) * 0.35),
    ];
    const alphaScale = 1.0 + intensity * 0.45;

    // Diffuse wet pool under the blot
    const pool = target.createRadialGradient(cx, cy, 0, cx, cy, rPx * 2.6);
    pool.addColorStop(0, `rgba(${pigment[0]},${pigment[1]},${pigment[2]},${0.38 * alphaScale})`);
    pool.addColorStop(0.4, `rgba(${washRgb[0]},${washRgb[1]},${washRgb[2]},${0.2 * alphaScale})`);
    pool.addColorStop(1, "rgba(255,255,255,0)");
    target.fillStyle = pool;
    target.beginPath();
    target.arc(cx, cy, rPx * 2.6, 0, Math.PI * 2);
    target.fill();

    // Soft pigment blooms with seed jitter (wet-on-wet)
    const blooms = 6 + Math.floor(rnd() * 4);
    for (let i = 0; i < blooms; i++) {
      const ox = (rnd() - 0.5) * rPx * 1.1;
      const oy = (rnd() - 0.5) * rPx * 1.1;
      const rr = rPx * (0.7 + rnd() * 0.95);
      const [r, g, b] = i % 2 === 0 ? pigment : washRgb;
      const g2 = target.createRadialGradient(cx + ox, cy + oy, 0, cx + ox, cy + oy, rr);
      g2.addColorStop(0, `rgba(${r},${g},${b},${Math.min(1, (0.48 + rnd() * 0.28) * alphaScale)})`);
      g2.addColorStop(0.5, `rgba(${r},${g},${b},${0.2 * alphaScale})`);
      g2.addColorStop(1, "rgba(255,255,255,0)");
      target.fillStyle = g2;
      target.beginPath();
      target.ellipse(cx + ox, cy + oy, rr * (0.9 + rnd() * 0.45), rr * (0.7 + rnd() * 0.5), rnd() * Math.PI, 0, Math.PI * 2);
      target.fill();
    }

    // Irregular watercolor silhouette
    for (const layer of layers) {
      const [r, g, b] = layer.wash ? washRgb : pigment;
      const a = WC_LITE_ALPHA * alphaScale * (layer.wash ? 0.45 : 1);
      target.fillStyle = `rgba(${r},${g},${b},${a})`;
      fillPoly(target, layer.poly, cx, cy, rPx * (1.05 + (layer.wash ? 0.35 : 0.1)));
    }

    // Edge granulation / dry-brush bites
    const rndTex = mulberry32(seed ^ 0xc2b2ae35);
    target.save();
    target.globalCompositeOperation = "destination-out";
    const holes = 16 + Math.floor(rndTex() * 18);
    for (let i = 0; i < holes; i++) {
      const ang = rndTex() * Math.PI * 2;
      const d = Math.sqrt(rndTex()) * rPx * 1.35;
      const len = (0.08 + Math.abs(gauss(rndTex)) * 0.12) * rPx;
      target.beginPath();
      target.arc(cx + Math.cos(ang) * d, cy + Math.sin(ang) * d, Math.max(0.4, len), 0, Math.PI * 2);
      target.fillStyle = `rgba(0,0,0,${0.14 + rndTex() * 0.28})`;
      target.fill();
    }
    target.restore();
  }

  function rememberSprite(key, sprite) {
    if (spotSpriteCache.size >= SPOT_SPRITE_CACHE_MAX) {
      const oldest = spotSpriteCache.keys().next().value;
      spotSpriteCache.delete(oldest);
    }
    spotSpriteCache.set(key, sprite);
  }

  function getSpotSprite(s, rPx, rgb, intensity, preferFull) {
    const rKey = Math.round(rPx * 2) / 2;
    const seed = spotSeed(s);
    // Full Hobbs for personal recordings (few) or when the spot is large enough to read detail
    const simple = !preferFull && rPx < SIMPLE_SPOT_PX;
    const key = simple
      ? `lite:${seed}:${Math.round(intensity * 50)}:${rKey}`
      : `h:${seed}:${Math.round(intensity * 50)}:${rKey}`;

    const hit = spotSpriteCache.get(key);
    if (hit) return hit;

    const pad = Math.ceil(rPx * 3.0 + 10);
    const size = pad * 2;
    const layer = document.createElement("canvas");
    layer.width = Math.ceil(size * dpr);
    layer.height = Math.ceil(size * dpr);
    const lctx = layer.getContext("2d");
    lctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (simple) drawSimpleSpot(lctx, pad, pad, rPx, rgb, seed, intensity);
    else drawHobbsSpot(lctx, pad, pad, rPx, rgb, seed, intensity);

    const sprite = { canvas: layer, pad, size };
    rememberSprite(key, sprite);
    return sprite;
  }

  function paintBlob(s, radiusM, alphaMul, preferFull) {
    const pt = map.latLngToContainerPoint([s.lat, s.lng]);
    const rPx = Math.max(MIN_RADIUS_PX * 0.85, metersToPixels(radiusM, s.lat));
    const t = spotIntensity(s);
    const rgb = intensityToRgb(t);
    const sprite = getSpotSprite(s, rPx, rgb, t, preferFull);

    const dx = pt.x - sprite.pad;
    const dy = pt.y - sprite.pad;
    ctx.globalAlpha = Math.min(1, 1.1 * alphaMul);
    ctx.drawImage(sprite.canvas, dx, dy, sprite.size, sprite.size);
    // Extra wet bloom (scaled redraw — no per-spot canvas filter)
    const bloom = 1.65;
    const bw = sprite.size * bloom;
    const bh = sprite.size * bloom;
    ctx.globalAlpha = 0.38 * alphaMul;
    ctx.drawImage(sprite.canvas, pt.x - bw / 2, pt.y - bh / 2, bw, bh);
    ctx.globalAlpha = 1;
  }

  /** Stable subset so LOD changes don't flicker which complaints appear */
  function complaintsForZoom() {
    const z = map.getZoom();
    let max = LOD_311[0].max;
    for (const tier of LOD_311) {
      if (z >= tier.z) max = tier.max;
    }
    if (!Number.isFinite(max) || complaints311.length <= max) return complaints311;
    const out = [];
    const step = complaints311.length / max;
    for (let i = 0; i < max; i++) {
      out.push(complaints311[Math.floor(i * step)]);
    }
    return out;
  }

  /** Anchor so we can slide the canvas with the map mid-pan (no full redraw) */
  let paintAnchorLatLng = null;
  let paintAnchorPoint = null;
  let paintZoom = null;

  function resetWatercolorTransform() {
    canvas.style.transform = "";
  }

  function syncWatercolorTransform() {
    if (!paintAnchorLatLng || paintZoom == null || !paintAnchorPoint) return;
    const z = map.getZoom();
    const pt = map.latLngToContainerPoint(paintAnchorLatLng);
    const dx = pt.x - paintAnchorPoint.x;
    const dy = pt.y - paintAnchorPoint.y;
    if (z === paintZoom) {
      canvas.style.transform = `translate(${dx}px, ${dy}px)`;
      return;
    }
    // Mid-zoom: translate + scale around the painted anchor
    const scale = Math.pow(2, z - paintZoom);
    canvas.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`;
    canvas.style.transformOrigin = `${paintAnchorPoint.x}px ${paintAnchorPoint.y}px`;
  }

  function noiseBand(intensity) {
    const t = Math.max(0, Math.min(1, intensity));
    if (t < NOISE_BANDS.street[0]) return "quiet";
    if (t < NOISE_BANDS.alert[0]) return "street";
    return "alert";
  }

  function passesNoiseFilter(s) {
    return !!noiseFilter[noiseBand(spotIntensity(s))];
  }

  function paintWatercolor() {
    resetWatercolorTransform();
    canvas.style.transformOrigin = "0 0";

    const w = window.innerWidth;
    const h = window.innerHeight;
    ctx.clearRect(0, 0, w, h);

    const bounds = map.getBounds().pad(0.12);
    const inView = (s) => bounds.contains([s.lat, s.lng]);

    // 311 underpaint first (slightly softer), personal recordings on top
    const layer311 = complaintsForZoom();
    for (const s of layer311) {
      if (inView(s) && passesNoiseFilter(s)) paintBlob(s, RADIUS_311_M, 1, false);
    }
    for (const s of spots) {
      if (inView(s) && passesNoiseFilter(s)) paintBlob(s, RADIUS_M, 1, true);
    }

    paintAnchorLatLng = map.getCenter();
    paintAnchorPoint = map.latLngToContainerPoint(paintAnchorLatLng);
    paintZoom = map.getZoom();
  }

  function bindNoiseFilter(id, key) {
    const el = document.getElementById(id);
    el.checked = noiseFilter[key];
    el.addEventListener("change", () => {
      noiseFilter[key] = el.checked;
      // Keep at least one layer visible
      if (!noiseFilter.quiet && !noiseFilter.street && !noiseFilter.alert) {
        el.checked = true;
        noiseFilter[key] = true;
        return;
      }
      schedulePaint();
    });
  }
  bindNoiseFilter("filterQuiet", "quiet");
  bindNoiseFilter("filterStreet", "street");
  bindNoiseFilter("filterAlert", "alert");

  // Follow the map live via CSS transform; full redraw only when movement settles
  map.on("move zoom", () => syncWatercolorTransform());
  map.on("moveend zoomend", () => schedulePaint());
  map.on("resize", () => schedulePaint());
  window.addEventListener("resize", resizeCanvas);

  // Always: tap map to place
  map.on("click", (e) => {
    placePin(e.latlng.lat, e.latlng.lng, "map");
    setStatus(audioFile ? "Place set. Hit Paint." : "Place set. Add a sound next.");
  });

  document.getElementById("btnLocate").addEventListener("click", () => {
    if (!navigator.geolocation) {
      setStatus("GPS not available — tap the map instead.");
      return;
    }
    setStatus("Getting your position…");
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        let { latitude, longitude } = pos.coords;
        if (!MANHATTAN.bounds.contains([latitude, longitude])) {
          setStatus("You're outside Manhattan — place snapped to the island. Or tap the map.");
        }
        placePin(latitude, longitude, "gps");
        map.setView(
          [
            Math.min(Math.max(latitude, MANHATTAN.bounds.getSouth()), MANHATTAN.bounds.getNorth()),
            Math.min(Math.max(longitude, MANHATTAN.bounds.getWest()), MANHATTAN.bounds.getEast()),
          ],
          Math.max(map.getZoom(), 16)
        );
        if (MANHATTAN.bounds.contains([latitude, longitude])) {
          setStatus(audioFile ? "Position set. Hit Paint." : "Position set. Add a sound next.");
        }
      },
      () => setStatus("Could not get GPS — tap the map instead."),
      { enableHighAccuracy: true, timeout: 12000 }
    );
  });

  document.getElementById("btnUpload").addEventListener("click", () => {
    document.getElementById("fileInput").click();
  });

  document.getElementById("fileInput").addEventListener("change", (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    setSound(f, f.name);
    setStatus(place ? "Ready — hit Paint." : "Sound ready. Share position or tap the map.");
  });

  document.getElementById("btnRecord").addEventListener("click", async () => {
    const btn = document.getElementById("btnRecord");
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus("Mic not available — upload a file instead.");
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const recorder = new MediaRecorder(stream);
      const chunks = [];
      recorder.ondataavailable = (ev) => chunks.push(ev.data);
      recorder.onstop = () => {
        stream.getTracks().forEach((t) => t.stop());
        const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
        setSound(new File([blob], "voice-note.webm", { type: blob.type }), "Recorded voice note");
        btn.textContent = "Record 5s";
        setStatus(place ? "Ready — hit Paint." : "Sound ready. Share position or tap the map.");
      };
      recorder.start();
      btn.textContent = "Recording…";
      setStatus("Listening…");
      setTimeout(() => recorder.stop(), 5000);
    } catch {
      setStatus("Could not use the mic — upload a file instead.");
    }
  });

  document.getElementById("btnPaint").addEventListener("click", async () => {
    if (!audioFile || !place) return;

    el.paint.disabled = true;
    setStatus("Analyzing sound…");

    try {
      const data = await analyzeAudioFile(audioFile);

      const color = data.color || "#FFE566";
      const spot = {
        id: crypto.randomUUID(),
        lat: place.lat,
        lng: place.lng,
        color,
        label: data.label || "soft",
        score: data.score,
        stress: data.stress,
        intensity: data.intensity,
        rms: data.rms,
      };
      spots.push(spot);
      paintWatercolor();
      map.setView([place.lat, place.lng], Math.max(map.getZoom(), 16));

      try {
        await persistSpot(spot);
        setStatus(
          `<span class="swatch" style="background:${color}"></span>` +
            `Painted &amp; saved <strong>${escapeHtml(prettyLabel(spot.label))}</strong>.`
        );
      } catch (saveErr) {
        cacheSpotsLocally();
        setStatus(
          `<span class="swatch" style="background:${color}"></span>` +
            `Painted <strong>${escapeHtml(prettyLabel(spot.label))}</strong> (saved on this device only — server save failed).`
        );
      }
      audioFile = null;
      el.soundNote.textContent = "No sound yet.";
      el.soundNote.classList.remove("ready");
      document.getElementById("fileInput").value = "";
    } catch (err) {
      setStatus(`Could not analyze: ${escapeHtml((err && err.message) || "unknown error")}`);
    } finally {
      syncPaintEnabled();
    }
  });

  document.getElementById("btnClear").addEventListener("click", () => {
    setStatus("Clear only removes the pin — sounds stay saved on the server.");
    if (pin) {
      map.removeLayer(pin);
      pin = null;
    }
    place = null;
    el.placeNote.textContent = "Or tap anywhere on the map.";
    el.placeNote.classList.remove("ready");
    syncPaintEnabled();
  });

  document.getElementById("btnSave").addEventListener("click", () => {
    const exportCanvas = document.createElement("canvas");
    exportCanvas.width = canvas.width;
    exportCanvas.height = canvas.height;
    const ex = exportCanvas.getContext("2d");
    ex.fillStyle = "#ffffff";
    ex.fillRect(0, 0, exportCanvas.width, exportCanvas.height);
    ex.drawImage(canvas, 0, 0);
    ex.setTransform(dpr, 0, 0, dpr, 0, 0);
    ex.fillStyle = "rgba(17,17,17,.9)";
    ex.font = "600 28px 'Space Grotesk', system-ui, sans-serif";
    ex.fillText("Silence in NYC", 24, 40);
    const a = document.createElement("a");
    a.download = "silence-in-nyc.png";
    a.href = exportCanvas.toDataURL("image/png");
    a.click();
    setStatus("PNG downloaded — the map itself is already saved on the server.");
  });

  function prettyLabel(label) {
    return String(label || "").replace(/_/g, " ");
  }
  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  resizeCanvas();
  map.setView(MANHATTAN.center, 13);
  // Instant paint from last browser visit while server cache warms
  if (hydrate311FromLocal()) schedulePaint();
  setStatus("Loading saved sounds…");

  (async function boot() {
    const apiOk = await resolveApiBase();
    if (!apiOk) {
      setStatus("API offline — map still works; new paints stay on this device until deploy finishes.");
    }

    // Prefer embedded key (no flash / no watermark); fall back to /api/config
    const embedded = window.__CARTO_API_KEY__;
    if (embedded) {
      setBasemap(embedded);
    } else {
      try {
        const cfg = await fetch(apiUrl("/api/config")).then((r) => r.json());
        if (!cfg.cartoApiKey) throw new Error("missing carto key");
        setBasemap(cfg.cartoApiKey);
      } catch (_) {
        basemapLayer = L.tileLayer(
          "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
          {
            attribution:
              '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a>',
            maxZoom: 20,
          }
        ).addTo(map);
      }
    }

    if (!apiOk) {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        spots = raw ? JSON.parse(raw) : [];
      } catch {
        spots = [];
      }
      el.count.textContent = String(spots.length);
      await load311();
      paintWatercolor();
      return;
    }

    try {
      const [serverSpots] = await Promise.all([
        loadSpotsFromServer().then(async (initial) => {
          let serverSpots = initial;
          const localRaw = localStorage.getItem(STORAGE_KEY);
          if (localRaw) {
            try {
              const localSpots = JSON.parse(localRaw);
              if (Array.isArray(localSpots) && localSpots.length) {
                await fetch(apiUrl("/api/spots/import"), {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ spots: localSpots }),
                });
                serverSpots = await loadSpotsFromServer();
              }
            } catch (_) {}
          }
          return serverSpots;
        }),
        load311(),
      ]);

      spots = serverSpots;
      cacheSpotsLocally();
      paintWatercolor();
      setStatus("Walk the city. Share your position, record, paint.");
    } catch (_) {
      // Offline fallback — still try the 311 snapshot
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        spots = raw ? JSON.parse(raw) : [];
      } catch {
        spots = [];
      }
      el.count.textContent = String(spots.length);
      await load311();
      paintWatercolor();
      setStatus("Server offline — painting will stay on this device until the server is back.");
    }
  })();
})();
</script>
</body>
</html>
